[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "messages-decoder"
version = "0.1.0"
description = "Host-side decoder for the UBC Rocket message registry SD log records (Class A)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
messages-decoder = "messages_decoder.cli:main"

[project.optional-dependencies]
dev = ["jsonschema>=4.0"]

[tool.setuptools.packages.find]
include = ["messages_decoder*"]
exclude = ["tests*"]
