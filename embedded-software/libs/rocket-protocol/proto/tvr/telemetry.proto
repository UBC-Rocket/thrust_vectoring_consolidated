syntax = "proto3";
package tvr;
import "common.proto";

// Full state + control output, sent at 10Hz from FC to ground station.
message TelemetryState {
  // Timestamp (ms since boot, wraps at ~49 days)
  uint32 timestamp_ms     = 1;

  // EKF state (nav frame)
  Vec3       position     = 2;   // [m]
  Vec3       velocity     = 3;   // [m/s]
  Quaternion attitude     = 4;   // body-to-nav
  Vec3       angular_rate = 5;   // [rad/s] body frame

  // Flight state machine
  FlightState flight_state = 6;

  // Control outputs (for ground display / debugging)
  float thrust_cmd  = 7;   // [N]
  float gimbal_x    = 8;   // [rad]
  float gimbal_y    = 9;   // [rad]

  // On-board UWB tag positions in nav-frame meters, computed by the flight
  // controller via trilateration against the 4 ground anchors set by
  // SetProbeLayout. Two tags on the rocket; both optional (present only when
  // the UWB ranging frame for that tag was usable this tick).
  Vec2 uwb_tag_0 = 10;
  Vec2 uwb_tag_1 = 11;

  // Motor RPM reported by the bidirectional DShot ESC driver.
  float motor_rpm_upper = 12;   // [rev/min]
  float motor_rpm_lower = 13;   // [rev/min]
}
