syntax = "proto3";
package tvr;
import "common.proto";

message FlightCommand {
  oneof payload {
    StateCommand    state_cmd        = 1;
    SetPidGains     set_pid_gains    = 2;
    SetReference    set_reference    = 3;
    SetConfig       set_config       = 4;
    SetProbeLayout  set_probe_layout = 5;
    SetThrottle     set_throttle     = 6;
  }
}

// Manual engine throttle for bring-up / bench runs. Deliberately NOT part of
// SetConfig: config fields use zeros-are-unset merge semantics, while a
// commanded throttle of 0 is meaningful. Normalized 0..1 (the GCS UI shows
// percent); the firmware clamps on receipt and again at PWM conversion.
// throttle_upper is optional (presence-tracked, since 0 is meaningful):
// absent → `throttle` drives both motors (legacy senders); present →
// `throttle` is the lower motor, `throttle_upper` the upper.
message SetThrottle {
  float throttle = 1;                  // lower motor (or both) 0.0 .. 1.0
  optional float throttle_upper = 2;   // upper motor 0.0 .. 1.0
}

// Four UWB anchor positions on the ground, in nav-frame meters relative to the
// rocket's takeoff origin. The four anchors form a rectangle; there is no
// center anchor. The flight controller stores these and uses them as the
// known-position references for trilateration of the on-board UWB tags.
message SetProbeLayout {
  Vec2 anchor_0 = 1;
  Vec2 anchor_1 = 2;
  Vec2 anchor_2 = 3;
  Vec2 anchor_3 = 4;
}

// High-level state transitions
message StateCommand {
  enum Type {
    CMD_NONE   = 0;
    CMD_ARM    = 1;
    CMD_LAUNCH = 2;
    CMD_ABORT  = 3;
    CMD_LAND   = 4;
  }
  Type type = 1;
}

// PID gain tuning (all gains in one message)
message SetPidGains {
  // Attitude controller (diagonal of 3x3 gain matrices)
  Vec3  attitude_kp = 1;   // proportional
  Vec3  attitude_kd = 2;   // derivative
  Vec3  attitude_ki = 7;   // integral (tilt loop uses x/y only)

  // Z position PID
  float z_kp             = 3;
  float z_ki             = 4;
  float z_kd             = 5;
  float z_integral_limit = 6;
}

// Setpoint / reference commands
message SetReference {
  float      z_ref  = 1;   // target height [m]
  float      vz_ref = 2;   // target z velocity [m/s]
  Quaternion q_ref  = 3;   // target attitude (optional)
}

// Physical / limit configuration
message SetConfig {
  float mass      = 1;   // vehicle mass [kg]
  float T_min     = 2;   // min thrust [N]
  float T_max     = 3;   // max thrust [N]
  float theta_min = 4;   // min gimbal angle [rad]
  float theta_max = 5;   // max gimbal angle [rad]
}
